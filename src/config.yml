# ==========================================================
#  gc-playerlogger configuration
# ==========================================================
#
# Every action in the "events:" section has its own switches:
#
#   enabled      master switch for this action
#   ingame       show the alert to staff in-game
#   discord      send the alert to Discord
#   file         write the alert to plugins/gc-playerlogger/logs/
#   sensitive    true = every alert of this action is shown in red and pings discord.mention
#   webhook-url  send this action to its OWN webhook (leave "" to use the default)
#   channel-id   OR send this action to its OWN channel through the bot
#                (needs discord.bot-token and a bot that can write in that channel)
#
# Discord destination priority for each action:
#   1. webhook-url  2. channel-id  3. discord.default-webhook-url  4. discord.default-channel-id
#
# A webhook already belongs to one channel, so a webhook is all you need.
# channel-id is only for people who prefer to use a bot instead of webhooks.
# Always put IDs and tokens in "quotes".
#
# Commands: /plog reload | status | summary | test [action] | alerts

general:
  # Write logs to plugins/gc-playerlogger/logs/YYYY-MM-DD.log
  log-to-file: true
  # Delete log files older than this many days (0 = never delete)
  log-retention-days: 30
  # Players that are never logged (names, case-insensitive).
  # Players with the permission playerlogger.exempt are ignored as well.
  ignored-players: []

discord:
  enabled: true
  # Used by every action that has no webhook-url / channel-id of its own.
  # Discord: Channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL
  default-webhook-url: ""
  # Optional bot mode (only needed if you use channel-id anywhere)
  bot-token: ""
  default-channel-id: ""
  # Webhook mode only: name and avatar of the sender
  username: "gc-playerlogger"
  avatar-url: ""
  # Shown in the footer of every embed, e.g. "My Survival Server" (empty = just "gc-playerlogger")
  server-name: ""
  # Show the player's head next to the name
  show-avatars: true
  # Add World / Location / Gamemode / Ping fields to player embeds
  embed-fields: true
  # Who gets pinged for sensitive alerts. Examples: "<@&ROLE_ID>" or "<@USER_ID>"
  mention: ""
  # Alerts are sent in batches (Discord rate limits). 40 ticks = 2 seconds
  send-interval-ticks: 40

ingame:
  enabled: true
  # MiniMessage format for player alerts. Placeholders:
  #   <title> <action> <player> <detail> <world> <x> <y> <z> <gamemode> <ping>
  # <c> is the action's color (use it like a tag: <c>text</c>).
  # Hover over the player name to see world, location, gamemode and ping; click to fill /tp.
  format: "<dark_gray>[<gold>PLog</gold>]</dark_gray> <c><bold><title></bold></c> <dark_gray>|</dark_gray> <hover:show_text:'<gray>World: <white><world></white><newline>Location: <white><x>, <y>, <z></white><newline>Gamemode: <white><gamemode></white><newline>Ping: <white><ping> ms</white><newline><yellow>Click to fill /tp</yellow></gray>'><click:suggest_command:'/tp <x> <y> <z>'><yellow><player></yellow></click></hover><dark_gray> » </dark_gray><white><detail></white>"
  # Format for server alerts (TPS alert, daily summary). Same placeholders.
  system-format: "<dark_gray>[<gold>PLog</gold>]</dark_gray> <c><bold><title></bold></c><dark_gray> » </dark_gray><white><detail></white>"
  sensitive-prefix: "<red><bold>! </bold></red>"
  # true = staff do not see their own actions
  hide-own: false

# ----------------------------------------------------------
#  Server monitoring
# ----------------------------------------------------------
monitoring:
  tps-alert:
    # Alert when the 1-minute TPS drops below this value
    threshold: 15.0
    # Below this value the alert is marked sensitive (red + mention)
    critical-below: 10.0
    # How often TPS is checked
    check-interval-seconds: 30
    # Minimum minutes between two alerts while the lag continues
    cooldown-minutes: 5
    # Send a "TPS Recovered" message when the server is fine again
    send-recovery: true
    # No alerts right after the server starts (startup is always laggy)
    startup-grace-seconds: 120
  daily-summary:
    # Server time, HH:mm. The report covers the time since the last report.
    time: "00:00"
    # How many players / commands to list (1-10)
    top-count: 5
    # Do not send an empty report
    skip-if-empty: true

# ----------------------------------------------------------
#  Per-action settings
# ----------------------------------------------------------
events:

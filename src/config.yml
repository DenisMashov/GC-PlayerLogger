# ----------------------------------------------------------
#  Filters
# ----------------------------------------------------------
filters:
  commands:
    # Commands that are never logged (empty = every command is logged)
    ignored: []
    # Commands that are logged, but their arguments are hidden: "/login ********"
    # Remove a command from this list only if you really want passwords in your logs!
    mask-args: [login, l, register, reg, changepassword, cp, unregister, passwd]
    # Commands that are always treated as sensitive (red alert + mention)
    sensitive: [op, deop, gamemode, gm, give, kill, stop, reload, ban, ban-ip, pardon, whitelist, lp, luckperms, execute, fill, setblock, summon, clear, effect, enchant, tp, teleport]

  chat:
    # Chat messages, signs and books containing one of these words become sensitive.
    # Example: [hack, cheat, grief]
    sensitive-words: []

  join:
    # Add the player's IP address to join alerts
    log-ip: false

  teleport:
    # Which teleport causes are logged (COMMAND, PLUGIN, UNKNOWN, ENDER_PEARL, ...)
    causes: [COMMAND, PLUGIN, UNKNOWN]

  blocks:
    # true = log EVERY block break/place (very spammy!)
    log-all: false
    # Only these blocks are logged
    watched:
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - ANCIENT_DEBRIS
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
      - SPAWNER
      - LAVA
      - FIRE
    # These blocks are sensitive: red alert + mention
    sensitive:
      - TNT
      - BEDROCK
      - COMMAND_BLOCK
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK
      - STRUCTURE_BLOCK

  buckets:
    # Buckets that are logged when emptied (LAVA_BUCKET, WATER_BUCKET, POWDER_SNOW_BUCKET, ...)
    watched: [LAVA_BUCKET]

  villager:
    # Only log trades that give one of these items (empty = log every trade)
    # Example: [ENCHANTED_BOOK, DIAMOND_SWORD, DIAMOND_PICKAXE]
    trade-only-items: []
